plugins {
    id 'com.android.application'
}

android {
    namespace 'com.multicultural.demo'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        // BuildConfig.BASE_URL 주입용 — 서버 IP 를 코드/repo 에 박지 않음
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.multicultural.demo'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        // 서버 BASE_URL — gradle.properties 또는 -P 옵션으로 주입.
        // 기본값 emulator localhost (10.0.2.2). 시연/배포 시:
        //   ./gradlew assembleDebug -Pschoolbridge.baseUrl=http://YOUR_SERVER:8000
        // trailing slash 자동 제거 — 안드 코드가 BASE_URL + "/path" 로 concat 하므로
        // 입력값에 끝 / 있으면 더블 슬래시로 404 발생 방지.
        def baseUrl = (project.findProperty('schoolbridge.baseUrl') ?: 'http://10.0.2.2:8000').replaceAll('/+$', '')
        buildConfigField "String", "BASE_URL", "\"${baseUrl}\""
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // ML Kit Korean OCR — CER ~35%, F1 0.95+ (ocr_lab_schoolbridge Round 5 결과)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'
    // OpenCV 4.9 — 이미지 전처리 (grayscale, CLAHE, Perspective Transform)
    implementation 'org.opencv:opencv:4.9.0'
}
