plugins {
    id 'com.android.application'
}

android {
    namespace 'com.multicultural.demo'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId 'com.multicultural.demo'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
